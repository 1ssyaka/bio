<!DOCTYPE html>
<html lang="ru">
<head>

<title>issya_ka</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000 url('background.jpg') center/cover no-repeat fixed;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    overflow: hidden;
  }
  body {
    user-select: none;
    -webkit-user-select: none;
  }

  .video-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .35);
    z-index: -1;
  }

  /* ---- анимации появления ---- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeLeft {
    from { opacity: 0; transform: translateY(-100%) translateX(-30px); }
    to   { opacity: 1; transform: translateY(-100%); }
  }
  @keyframes fadeRight {
    from { opacity: 0; transform: translateY(-50%) translateX(30px); }
    to   { opacity: 1; transform: translateY(-50%); }
  }
  @keyframes fadeFriends {
    from { opacity: 0; transform: translateY(-50%) translateX(-30px); }
    to   { opacity: 1; transform: translateY(-50%); }
  }

  .card {
    width: min(420px, 92vw);
    padding: 40px 30px;
    text-align: center;
    background: rgba(0, 0, 0, .45);
    border: 1px solid rgba(255, 255, 255, .15);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    opacity: 0;
    animation-fill-mode: forwards;
    animation-timing-function: cubic-bezier(.22, .8, .3, 1);
    animation-duration: .8s;
  }

  /* центральная карточка — первая */
  .main-card { animation-name: fadeUp; animation-delay: .1s; }

  /* боковые — после центральной */
  .card-def     { animation-name: fadeLeft;   animation-delay: .8s; }
  .langs-card   { animation-name: fadeRight;  animation-delay: 1.1s; }
  .card-friends { animation-name: fadeFriends; animation-delay: 1.4s; }

  .avatar {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, .3);
    margin-bottom: 16px;
  }
  h1 { font-size: 24px; margin-bottom: 6px; }

  .views { font-size: 13px; opacity: .7; margin-bottom: 14px; }

  .bio {
    font-size: 14px;
    opacity: .85;
    margin-bottom: 26px;
    min-height: 20px;
  }
  .links {
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .35);
    background: rgba(255, 255, 255, .06);
    transition: .25s;
  }
  .links a svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }
  .links a:hover {
    border-color: #fff;
    background: rgba(255, 255, 255, .2);
    transform: scale(1.1);
  }
  .music {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .music button {
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
  }
  .marquee { overflow: hidden; white-space: nowrap; width: 140px; }
  .marquee span { display: inline-block; animation: scroll 8s linear infinite; }
  @keyframes scroll {
    from { transform: translateX(100%); }
    to   { transform: translateX(-100%); }
  }
  .langs-card {
    position: fixed;
    right: 4vw;
    top: 50%;
    transform: translateY(-50%);
    width: min(260px, 92vw);
    padding: 28px 24px;
    margin: 0;
  }
  .langs-card h2 {
    font-size: 18px;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .tag {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, .3);
    background: rgba(255, 255, 255, .06);
    font-size: 13px;
    font-weight: 600;
    transition: .25s;
  }
  .tag:hover {
    background: rgba(255, 255, 255, .2);
    border-color: #fff;
  }
  .side-card {
    position: fixed;
    left: 4vw;
    width: min(260px, 92vw);
    padding: 24px;
  }
  .side-card h2 {
    font-size: 18px;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  .card-def {
    top: calc(50% - 140px);
    transform: translateY(-100%);
  }
  .card-friends {
    top: calc(50% + 60px);
    transform: translateY(-50%);
  }
  .friends-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .friend {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, .2);
    background: rgba(255, 255, 255, .06);
    text-decoration: none;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    transition: .25s;
  }
  .friend:hover {
    background: rgba(255, 255, 255, .2);
    border-color: #fff;
    transform: translateX(4px);
  }
  .friend img {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
  }

  /* ---- мобильная версия ---- */
  @media (max-width: 860px) {
    body {
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      height: auto;
      min-height: 100vh;
      padding: 24px 12px;
    }
    .side-card,
    .langs-card {
      position: static;
      transform: none;
      left: auto;
      right: auto;
      top: auto;
      width: min(420px, 92vw);
      padding: 22px 18px;
    }
    .card { padding: 30px 20px; }

    /* на телефоне порядок и анимация единые: карточка + лёгкий подъём */
    .main-card,
    .card-def,
    .langs-card,
    .card-friends {
      animation-name: fadeUp;
      animation-duration: .7s;
    }
    .main-card    { animation-delay: .1s; }
    .card-def     { animation-delay: .8s; }
    .langs-card   { animation-delay: 1.1s; }
    .card-friends { animation-delay: 1.4s; }

    .card        { order: 1; }
    .card-def    { order: 2; }
    .langs-card  { order: 3; }
    .card-friends{ order: 4; }

    .avatar { width: 130px; height: 130px; }
    h1 { font-size: 21px; }
  }

  /* тем, кто просит меньше движения — сразу всё видно */
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; opacity: 1; }
  }
</style>

<script>
const COUNTER_KEY = 'issya-ka-site-views-v2';
fetch('https://countapi.mileshilliard.com/api/v1/hit/' + COUNTER_KEY)
  .then(r => r.json())
  .then(d => { document.getElementById('views').textContent = d.value; })
  .catch(err => {
    console.warn('Счётчик просмотров недоступен:', err);
    document.getElementById('views').textContent = '—';
  });

const phrases = ['АХАХАХАХ', 'ПРИЕДЬ НАЙДИ МЕНЯ', 'АХАХАХАХААААХА'];
let p = 0, i = 0, del = false;
(function type() {
  const el = document.getElementById('bio');
  const cur = phrases[p];
  el.textContent = cur.slice(0, i);
  if (!del && i < cur.length) i++;
  else if (del && i > 0) i--;
  else if (i === cur.length) { del = true; setTimeout(type, 1500); return; }
  else { del = false; p = (p + 1) % phrases.length; }
  setTimeout(type, del ? 40 : 90);
})();

const audio = document.getElementById('audio');
const btn = document.getElementById('playBtn');
audio.volume = 0.1;
let started = false;
document.addEventListener('click', () => {
  if (!started) {
    audio.play().catch(() => {});
    started = true;
    btn.textContent = '🎵';
  }
}, { once: true });
btn.onclick = () => {
  if (audio.paused) { audio.play().catch(() => {}); btn.textContent = '🎵'; }
  else { audio.pause(); btn.textContent = '❌'; }
};
</script>
