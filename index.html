<title>issya_ka</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;   /* главная карточка снова в центре */
  background: #000 url('background.jpg') center/cover no-repeat fixed;
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
  overflow: hidden;
}


  /* видео на весь экран */
  .video-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }

  /* затемнение поверх видео */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .35);
    z-index: -1;
  }

  /* стеклянная карточка (и главная, и боковая) */
  .card {
    width: min(420px, 92vw);
    padding: 40px 30px;
    text-align: center;
    background: rgba(0, 0, 0, .45);
    border: 1px solid rgba(255, 255, 255, .15);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* аватар — ещё больше */
  .avatar {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, .3);
    margin-bottom: 16px;
  }

  h1 { font-size: 24px; margin-bottom: 6px; }

  .views { font-size: 13px; opacity: .7; margin-bottom: 14px; }

  .bio {
    font-size: 14px;
    opacity: .85;
    margin-bottom: 26px;
    min-height: 20px;
  }
  .bio::after {
    content: '|';
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* иконки — чуть меньше */
  .links {
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .35);
    background: rgba(255, 255, 255, .06);
    transition: .25s;
  }
  .links a svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }
  .links a:hover {
    border-color: #fff;
    background: rgba(255, 255, 255, .2);
    transform: scale(1.1);
  }

  /* музыка */
  .music {
    margin-top: 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .music button {
    background: none;
    border: none;
    color: #fff;
    font-size: 22px;
    cursor: pointer;
  }
  .marquee { overflow: hidden; white-space: nowrap; width: 140px; }
  .marquee span { display: inline-block; animation: scroll 8s linear infinite; }
  @keyframes scroll {
    from { transform: translateX(100%); }
    to   { transform: translateX(-100%); }
  }

  /* ===== боковая карточка с языками ===== */
  .langs-card {
  position: fixed;
  right: 4vw;
  top: 50%;
  transform: translateY(-50%);
  width: min(260px, 92vw);
  padding: 28px 24px;
  margin: 0;
}

  .langs-card h2 {
    font-size: 18px;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .tag {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, .3);
    background: rgba(255, 255, 255, .06);
    font-size: 13px;
    font-weight: 600;
    transition: .25s;
  }
  .tag:hover {
    background: rgba(255, 255, 255, .2);
    border-color: #fff;
  }
  /* ===== левые карточки ===== */
.side-card {
  position: fixed;
  left: 4vw;
  width: min(260px, 92vw);
  padding: 24px;
}
.side-card h2 {
  font-size: 18px;
  margin-bottom: 14px;
  letter-spacing: 1px;
}
/* первая — примерно на уровне верхней трети карточки с языками */
.card-def {
  top: calc(50% - 140px);
  transform: translateY(-100%);
}
/* вторая — чуть ниже */
.card-friends {
  top: calc(50% + 60px);
  transform: translateY(-50%);
}
.friends-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.friend {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, .2);
  background: rgba(255, 255, 255, .06);
  text-decoration: none;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  transition: .25s;
}
.friend:hover {
  background: rgba(255, 255, 255, .2);
  border-color: #fff;
  transform: translateX(4px);
}
.friend img {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  object-fit: cover;
}
.def-text {
  font-size: 13px;
  opacity: .85;
  line-height: 1.5;
}


  /* на телефоне карточки ставятся друг под другом */
  /* на телефоне боковые карточки — под основной, листаются вместе со страницей */
@media (max-width: 860px) {
  body {
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    height: auto;
    min-height: 100vh;
    padding: 20px 0;
  }

  /* снимаем фиксированное позиционирование — карточки встают в общий поток */
  .side-card,
  .langs-card {
    position: static;
    transform: none;
    left: auto;
    right: auto;
    top: auto;
    width: min(420px, 92vw);
  }

  /* порядок на экране телефона */
  .card-def    { order: 1; }
  .card        { order: 2; }
  .langs-card  { order: 3; }
  .card-friends{ order: 4; }
}

</style>

<script>
const COUNTER_KEY = 'issya-ka-site-views-v2';
fetch('https://countapi.mileshilliard.com/api/v1/hit/' + COUNTER_KEY)
  .then(r => r.json())
  .then(d => { document.getElementById('views').textContent = d.value; })
  .catch(() => { document.getElementById('views').textContent = '—'; });


  // печатающийся текст
  const phrases = ['АХАХАХАХ ЕБАТЬ ТЫ НЕЛЮДЬ ЕБАНЫЙ', 'ПРИЕДЬ НАЙДИ МЕНЯ УЕБИЩЕЕЕ', 'АХАХАХАХААААХА'];
  let p = 0, i = 0, del = false;
  (function type() {
    const el = document.getElementById('bio');
    const cur = phrases[p];
    el.textContent = cur.slice(0, i);
    if (!del && i < cur.length) i++;
    else if (del && i > 0) i--;
    else if (i === cur.length) { del = true; setTimeout(type, 1500); return; }
    else { del = false; p = (p + 1) % phrases.length; }
    setTimeout(type, del ? 40 : 90);
  })();

  // музыка
  const audio = document.getElementById('audio');
  const btn = document.getElementById('playBtn');
  audio.volume = 0.2;  // громкость от 0 до 1
  let started = false;
  document.addEventListener('click', () => {
    if (!started) { audio.play(); started = true; btn.textContent = '🎵'; }
  }, { once: true });
  btn.onclick = () => {
    if (audio.paused) { audio.play(); btn.textContent = '🎵'; }
    else { audio.pause(); btn.textContent = '❌'; }
  };
</script>
